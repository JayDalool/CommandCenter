id = "D-010"
schema = 1
date = "2026-11-23"
decided_by = "jay"
source = "Jay, Command Center pane, CC-057 questions Q170 (small app code) and Q171 (guard + flag)"
projects = ["commandcenter", "mfe", "gyst", "samvision"]
question = "Which PRs may ccd merge by itself, and how strict is the rest?"
decision = "Small, low-risk PRs merge by themselves through ccd in the projects Jay switches on, one project at a time. That includes small app code outside the protected and sensitive areas, not only tests and docs. Everything else merges only after Jay's 'merge it' for that exact head."
rationale = "Same speed-up as before for tests and docs, plus small helpers, with deny-wins path rules, an import-marker content rule, named CI checks and a switch that is off by default."
rules = [
  "config auto_merge is a list of project keys, empty by default; anything else reads as empty",
  "deny always wins; only tests and docs may be added; app code may only be modified",
  "a file that imports the sign-in, database or permission layer never auto-merges",
  "GauzeMate, paused projects and client or employer projects never merge by themselves",
  "merging never deploys",
]
reconsider = "after a week of watching auto-merges, or at the first auto-merge Jay disagrees with"
