# Zaylo Labs Website: AUTONOMOUS PRODUCT (target). Added by Jay 2026-11-25; onboarding per D-024.
# Enforced merge stays "owner" (D-008): Jay merges every PR until he turns automatic merging on for this repo.
schema = 1
project = "zaylolabs"
mode = "autonomous_product"
decisions = ["D-003", "D-006", "D-008", "D-024"]
learning = "contextual"

[enforced]
merge = "owner"
night = "normal"
paused = ""
max_lanes = 2
ui_fix = "ask"

[target]
plan_approval = { required_for = ["risk_high", "ui_change_major"], package = "standard" }
review = { claude = "always", codex = "on_risk_high", security = "on_trigger" }
merge = { policy = "auto", requires = ["ci_green", "review_approved_at_head", "security_pass_if_required", "risk_at_most_medium"] }
deploy = { policy = "jay_confirms", env = "live", requires = ["merged", "verify_pass"] }
notify = { release = "summary", needs_you = "slack_immediate" }
execution = { allowed_nodes = ["server"], preferred_node = "server", repo_storage = "server", server_clone = "allowed", secrets = "server_scoped", model_providers = ["anthropic", "openai"] }
artifacts = { store = "server", drive_mirror = "never" }

[capabilities]
health_checks = false
auto_rollback = false
